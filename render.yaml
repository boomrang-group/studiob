services:
  - type: web
    name: studio-boomrang-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: studio-boomrang-db
          property: connectionString
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAXICASH_MERCHANT_ID
        sync: false
      - key: MAXICASH_MERCHANT_PASSWORD
        sync: false

databases:
  - name: studio-boomrang-db
    plan: free
    databaseName: studioboomrang
    user: studioboomrang
