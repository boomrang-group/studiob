[build]
  command = "pnpm exec tsc --build --force && PORT=8080 BASE_PATH=/ pnpm --filter @workspace/studio-boomrang run build"
  publish = "artifacts/studio-boomrang/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.30.3"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_PLUGIN_FORCE_RUN = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
