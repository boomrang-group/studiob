[build]
  command = "PORT=8080 BASE_PATH=/ pnpm --filter @workspace/studio-boomrang run typecheck && PORT=8080 BASE_PATH=/ pnpm --filter @workspace/studio-boomrang run build"
  publish = "artifacts/studio-boomrang/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.30.3"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/*"
  to = "https://studioboomrang.replit.app/:splat"
  status = 302
  force = true